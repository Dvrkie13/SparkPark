<title>SparkPark Builder — design reference</title>
<!--
  SparkPark one-time builder: DESIGN REFERENCE (standalone, opens in any browser).
  This is a mockup of the look, animations and state flow described in CLAUDE.md
  ("Launcher (one-time builder)"). The build steps here are simulated with timers;
  the real builder must call the actual verify / extract / recompile / link steps.
  Fixed 1280x720 stage. All artwork is original; no game assets.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1b1d26;display:flex;min-height:100vh;align-items:center;justify-content:center}
a{color:#7a4a22}a:hover{color:#5a3418}
@keyframes sp-rise{0%{transform:translateY(130%)}68%{transform:translateY(-4%)}84%{transform:translateY(1.5%)}100%{transform:translateY(0)}}
@keyframes sp-pop{0%{transform:scale(.2) rotate(-6deg);opacity:0}70%{transform:scale(1.07) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes sp-fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp-capin{from{opacity:0;transform:translateY(-8px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sp-drift{from{transform:translateX(0)}to{transform:translateX(46px)}}
@keyframes sp-spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes sp-twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes sp-zap{0%,86%,100%{filter:drop-shadow(0 0 10px rgba(255,220,80,.9))}90%{filter:drop-shadow(0 0 2px rgba(255,220,80,.2))}94%{filter:drop-shadow(0 0 18px rgba(255,230,120,1))}}
@keyframes sp-sway{0%,100%{transform:rotate(-.4deg)}50%{transform:rotate(.4deg)}}
@keyframes sp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes sp-fall{from{background-position:0 0}to{background-position:0 120px}}
@keyframes sp-mist{0%,100%{transform:translate(0,0) scale(1);opacity:.75}50%{transform:translate(6px,-8px) scale(1.12);opacity:.95}}
@keyframes sp-spin2{to{transform:rotate(360deg)}}
.sp-sign{animation:sp-rise 1200ms cubic-bezier(.25,.9,.35,1) both}
.sp-swing{transform-origin:50% 100%;animation:sp-sway 6s ease-in-out 2.4s infinite}
.sp-logo{animation:sp-pop 560ms cubic-bezier(.3,1.5,.5,1) 950ms both}
.sp-b1{animation:sp-pop 520ms cubic-bezier(.3,1.6,.5,1) 1300ms both}
.sp-capin{animation:sp-capin 380ms cubic-bezier(.3,1.5,.5,1) both}
.sp-bar{animation:sp-fade 520ms ease-out 1900ms both}
.sp-cloud{animation:sp-drift 11s ease-in-out infinite alternate}
.sp-rays{animation:sp-spin 90s linear infinite}
.sp-tw{animation:sp-twinkle 2.6s ease-in-out infinite}
.sp-bolt{animation:sp-zap 3.4s linear 2.2s infinite}
.sp-idle{animation:sp-pulse 2.4s ease-in-out 2.2s infinite}
.sp-water{animation:sp-fall 900ms linear infinite}
.sp-mist{animation:sp-mist 3.2s ease-in-out infinite}
.sp-spinner{animation:sp-spin2 800ms linear infinite}
.sp-btn{transition:transform 180ms ease, filter 180ms ease}
.sp-btn:hover,.sp-btn:focus-visible{transform:scale(1.05);filter:brightness(1.08) saturate(1.05)}
.sp-btn:focus-visible{outline:none}
.sp-btn:focus-visible .sp-label{box-shadow:inset 0 3px 0 rgba(255,255,255,.9), inset 0 -5px 0 rgba(170,120,60,.35), 0 0 0 5px #FFE36E}
@media (prefers-reduced-motion: reduce){.sp-sign,.sp-swing,.sp-logo,.sp-b1,.sp-capin,.sp-bar,.sp-cloud,.sp-rays,.sp-tw,.sp-bolt,.sp-idle,.sp-water,.sp-mist,.sp-spinner{animation:none}}
</style>

</head>

                <span style="font-size: 34px">Checking disc…</span>

              <span data-show="isBuild" style="display:contents;align-items:center;gap:inherit">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#E25E22" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4 L20 10 L17 13 L11 7 Z"></path><path d="M12.5 8.5 L4 17 L7 20 L15.5 11.5"></path></svg>
                <span>Build Recomp</span>
              </span>
              <span data-show="isBuilding" style="display:contents;align-items:center;gap:inherit">
                <span style="display: flex; flex-direction: column; align-items: center; gap: 6px">
                  <span style="font-size: 30px">Building… <span id="pct">0</span>%</span>
                  <span style="display: block; width: 300px; height: 14px; border-radius: 8px; background: #D9C08E; box-shadow: inset 0 2px 3px rgba(90,40,0,.35); overflow: hidden"><span id="bar" style="display: block; height: 100%; width: 0%; border-radius: 8px; background: linear-gradient(180deg, #FFB070, #E25E22); box-shadow: 0 0 6px rgba(255,140,60,.7)"></span></span>
                </span>
              </span>
              <span data-show="isPlay" style="display:contents;align-items:center;gap:inherit">
                <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5 L20.5 12 L6 20.5 Z" fill="#2FA594" stroke="#2FA594" stroke-width="2" stroke-linejoin="round"></path></svg>
                <span>Play</span>
              </span>
            </span>
          </button>

        <span data-show="showCaption" style="display:contents;align-items:center;gap:inherit">
          <p class="sp-capin" id="capP" style="margin: 0; padding: 4px 18px; border-radius: 999px; background: rgba(60,28,8,.6); color: #FFF3DC; font-size: 19px; font-weight: 700; text-shadow: 0 1px 0 rgba(0,0,0,.4); display: flex; align-items: center; gap: 8px">
            <span data-show="showCheck" style="display:contents;align-items:center;gap:inherit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FE0C9" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7"></path></svg></span>
            <span id="caption"></span>
          </p>

    <div aria-hidden="true" style="position: absolute; left: 14px; top: 128px; width: 652px; height: 40px; border-radius: 20px; background: linear-gradient(180deg, #D79A5C 0%, #B47A40 45%, #7E4E22 100%); box-shadow: inset 0 3px 0 rgba(255,220,170,.5), 0 6px 8px rgba(40,20,0,.35)">
      <div style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #EBC58E 0 22%, #C58E52 23% 45%, #9A6534 46% 70%, #6E4421 71%)"></div>
      <div style="position: absolute; right: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #EBC58E 0 22%, #C58E52 23% 45%, #9A6534 46% 70%, #6E4421 71%)"></div>
    </div>

    <div class="sp-logo" style="position: absolute; left: 110px; top: 0; width: 460px; height: 140px; transform-origin: 50% 80%">
      <div aria-hidden="true" style="position: absolute; left: 100px; top: -24px; width: 260px; height: 180px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,240,170,.75), rgba(255,240,170,0))"></div>
      <div style="position: absolute; left: 0; top: 10px; width: 460px; height: 112px; box-sizing: border-box; border-radius: 60px 60px 26px 26px / 70px 70px 26px 26px; background: linear-gradient(180deg, #FFFBEA 0%, #F6E5BC 55%, #E6C88E 100%); border: 6px solid #B8862F; box-shadow: inset 0 0 0 4px #FFE7A3, inset 0 -10px 14px rgba(150,95,30,.3), 0 6px 0 #7A5418, 0 14px 18px rgba(40,20,0,.35); display: flex; align-items: center; justify-content: center; gap: 8px">

        <h1 style="margin: 0; font-size: 66px; line-height: 1; padding-top: 10px; font-weight: 800; letter-spacing: 1px; color: #F06A28; text-shadow: 0 2px 0 #C24A14, 0 4px 0 #8E3410, 0 7px 8px rgba(80,30,0,.35)">Spark<span style="color: #2FA594; text-shadow: 0 2px 0 #1E7A6E, 0 4px 0 #15524B, 0 7px 8px rgba(0,40,30,.35)">Park</span></h1>

  <div class="sp-bar" style="position: absolute; left: 0; bottom: 0; width: 1280px; height: 58px; background: rgba(28,30,40,.85); box-shadow: inset 0 2px 0 rgba(255,255,255,.12); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-sizing: border-box; color: #FFFFFF; font-size: 20px; font-weight: 700">

    <span style="display: flex; gap: 10px; align-items: center"><span style="background: linear-gradient(180deg, #4FC9B8, #22897C); color: #FFFFFF; border-radius: 999px; padding: 0 12px; font-weight: 800; box-shadow: 0 3px 0 #15524B">A</span><span id="hint">Upload ISO</span></span>
  </div>

<script>
(function(){
  var phase='upload', pct=0, timer=null;
  var $=function(id){return document.getElementById(id)};
  var face=$('face'), btn=$('mainBtn');
  var COLORS={blue:['#4A86E0','#1F4A94'],orange:['#EE6A2C','#7A2A0C'],teal:['#35B0A0','#15524B']};
  function show(name,on){document.querySelectorAll('[data-show="'+name+'"]').forEach(function(el){el.style.display=on?'contents':'none'})}
  function render(){
    var c=phase==='play'?'teal':(phase==='upload'||phase==='verifying')?'blue':'orange';
    face.style.backgroundColor=COLORS[c][0]; btn.style.background=COLORS[c][1];
    show('isUpload',phase==='upload'); show('isVerifying',phase==='verifying'); show('isBuild',phase==='build');
    show('isBuilding',phase==='building'); show('isPlay',phase==='play');
    var cap='';
    if(phase==='verifying')cap='Checking your disc…';
    else if(phase==='build')cap='Disc verified · ready to build';
    else if(phase==='building')cap=pct<25?'Extracting your disc…':pct<70?'Recompiling game code…':'Linking the runtime…';
    else if(phase==='play')cap='Build complete · ready to play';
    var capP=$('capP');
    var wasHidden=capP.parentNode.style.display==='none';
    show('showCaption',phase!=='upload');
    if(wasHidden&&phase!=='upload'){capP.style.animation='none';void capP.offsetWidth;capP.style.animation='';}
    show('showCheck',phase==='build'||phase==='play');
    $('caption').textContent=cap;
    $('pct').textContent=pct; $('bar').style.width=pct+'%';
    $('hint').textContent=phase==='upload'?'Upload ISO':phase==='build'?'Build':phase==='play'?'Play':'Please wait';
    btn.setAttribute('aria-label',phase==='upload'?'Upload ISO':phase==='verifying'?'Checking disc':phase==='build'?'Build Recomp':phase==='building'?'Building':'Play');
    $('idle').className=(phase==='upload'||phase==='build'||phase==='play')?'sp-idle':'';
  }
  function press(){
    if(phase==='upload'){phase='verifying';render();setTimeout(function(){phase='build';render()},1400);}
    else if(phase==='build'){phase='building';pct=0;render();
      timer=setInterval(function(){pct=Math.min(100,pct+2);if(pct>=100){clearInterval(timer);phase='play';}render()},80);}
    else if(phase==='play'){phase='upload';pct=0;render();}
  }
  btn.addEventListener('click',press);
  document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){if(document.activeElement!==btn){e.preventDefault();press();}}});
  render();
})();
</script>
